<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>What is a Woman? — Define</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap");

                @font-face {
  font-family: 'Titlefont';
  src: url('assets/titlefont.ttf') format('truetype');
}
            
                @font-face {
  font-family: 'Subtitlefont';
  src: url('assets/Subtitle.ttf') format('truetype');
}
            
            
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: #0d0b09;
                font-family: "EB Garamond", Georgia, serif;
                min-height: 100vh;
                overflow: hidden;
                cursor: none;
                position: relative;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
                opacity: 0.06;
                pointer-events: none;
                z-index: 300;
            }

            #bg-scene {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2.4rem;
                z-index: 1;
                padding: 2rem;
                text-align: center;
            }

            .prompt-label {
                font-family: "Subtitlefont";
                font-size: 0.7rem;
                font-weight: 300;
                letter-spacing: 0.42em;
                text-transform: uppercase;
                color: rgba(232, 226, 216, 0.35);
            }

            .typewriter-wrap h1 {
                font-family: "Titlefont";
                font-size: 30px;
                font-weight: 300;
                font-style: italic;
                letter-spacing: 0.2em;
                color: #e8e2d8;
                overflow: hidden;
                white-space: nowrap;
                width: 0;
                margin: 0 auto;
                border-right: 1px solid rgba(232, 226, 216, 0.65);
                animation:
                    typing 5s steps(22, end) 1.2s forwards,
                    blink-caret 0.75s step-end infinite;
            }

            @keyframes typing {
                from {
                    width: 0;
                }
                to {
                    width: 22ch;
                }
            }

            @keyframes blink-caret {
                from,
                to {
                    border-color: transparent;
                }
                50% {
                    border-color: rgba(232, 226, 216, 0.65);
                }
            }

            .input-area {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.4rem;
                width: 100%;
                max-width: 400px;
                opacity: 0;
                transform: translateY(10px);
                transition:
                    opacity 1.4s ease,
                    transform 1.4s ease;
            }

            .input-area.visible {
                opacity: 1;
                transform: translateY(0);
            }

            .input-rule {
                width: 28px;
                height: 1px;
                background: rgba(232, 226, 216, 0.18);
            }

            textarea#answer {
                width: 100%;
                background: transparent;
                border: none;
                border-bottom: 1px solid rgba(232, 226, 216, 0.18);
                outline: none;
                resize: none;
                padding: 0.6rem 0;
                font-family: "Subtitlefont";
                font-size: 1.1rem;
                font-style: italic;
                color: #e8e2d8;
                line-height: 1.75;
                min-height: 72px;
                caret-color: #e8e2d8;
                text-align: center;
            }

            textarea#answer::placeholder {
                color: rgba(232, 226, 216, 0.22);
                font-style: italic;
            }

            a {
                color: pink;
                text-decoration: none;
            }

            .submit-btn:hover:not(:disabled) {
                letter-spacing: 0.5em;
                color: #e8e2d8;
                border-color: rgba(232, 226, 216, 0.5);
            }

            .submit-btn:disabled {
                opacity: 0.28;
                cursor: default;
            }

            #overlay {
                position: fixed;
                inset: 0;
                z-index: 10;
                pointer-events: none;
            }

            #cursor {
                position: fixed;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: rgba(232, 226, 216, 0.55);
                pointer-events: none;
                z-index: 999;
                transform: translate(-50%, -50%);
            }

        

            .flash {
                position: fixed;
                inset: 0;
                background: #e8e2d8;
                z-index: 9999;
                opacity: 0;
                pointer-events: none;
            }

            .flash.go {
                animation: flash-out 0.55s steps(1) forwards;
            }

            @keyframes flash-out {
                0% {
                    opacity: 0;
                }
                15% {
                    opacity: 0.9;
                }
                30% {
                    opacity: 0;
                }
                52% {
                    opacity: 0.6;
                }
                65% {
                    opacity: 0;
                }
                82% {
                    opacity: 0.85;
                }
                100% {
                    opacity: 0;
                }
            }
        </style>
    </head>
    <body>
        <div id="cursor"></div>
        <div class="flash" id="flash"></div>

        <div id="bg-scene">
            <p class="prompt-label">before you proceed</p>

            <div class="typewriter-wrap">
                <h1>What is a woman?</h1>
            </div>

            <div class="input-area" id="inputArea">
                <div class="input-rule"></div>
                <textarea
                    id="answer"
                    rows="3"
                    placeholder="write your answer here…"
                    autocomplete="off"
                    spellcheck="false"></textarea>
                <a href="page2.html", >Continue</a>
            </div>
        </div>

        <canvas id="overlay"></canvas>

        <script>
            const canvas = document.getElementById("overlay");
            const ctx = canvas.getContext("2d");
            const cursorEl = document.getElementById("cursor");
            const hint = document.getElementById("hint");
            const inputArea = document.getElementById("inputArea");
            const ta = document.getElementById("answer");
            const btn = document.getElementById("submitBtn");

            let W, H;
            let overlayReady = false;
            let hasMovedMouse = false;
            let brushRadius = 88;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                drawOverlay();
            }

            function drawOverlay() {
                ctx.clearRect(0, 0, W, H);
                ctx.globalCompositeOperation = "source-over";
                ctx.fillStyle = "#b85c72";
                ctx.fillRect(0, 0, W, H);
                overlayReady = true;
            }

            resize();
            window.addEventListener("resize", () => {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                drawOverlay();
            });

            document.addEventListener("mousemove", (e) => {
                cursorEl.style.left = e.clientX + "px";
                cursorEl.style.top = e.clientY + "px";

                if (!overlayReady) return;

                if (!hasMovedMouse) {
                    hasMovedMouse = true;
                    hint.style.opacity = "0";
                }

                ctx.globalCompositeOperation = "destination-out";
                ctx.beginPath();
                ctx.arc(e.clientX, e.clientY, brushRadius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(0,0,0,1)";
                ctx.fill();
            });

            document.addEventListener("mousedown", () => {
                brushRadius = 140;
            });
            document.addEventListener("mouseup", () => {
                brushRadius = 88;
            });

            document.addEventListener(
                "touchmove",
                (e) => {
                    e.preventDefault();
                    const t = e.touches[0];
                    cursorEl.style.left = t.clientX + "px";
                    cursorEl.style.top = t.clientY + "px";
                    if (!overlayReady) return;
                    ctx.globalCompositeOperation = "destination-out";
                    ctx.beginPath();
                    ctx.arc(t.clientX, t.clientY, 110, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(0,0,0,1)";
                    ctx.fill();
                },
                { passive: false }
            );

            setTimeout(() => {
                inputArea.classList.add("visible");
                ta.focus();
            }, 5000);

            ta.addEventListener("input", () => {
                btn.disabled = ta.value.trim().length === 0;
            });

            function handleSubmit() {
                const val = ta.value.trim();
                if (!val) return;
                sessionStorage.setItem("firstDefinition", val);
                document.getElementById("flash").classList.add("go");
                setTimeout(() => {
                    window.location.href = "page2.html";
                }, 580);
            }

            ta.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !btn.disabled) handleSubmit();
            });
        </script>
    </body>
</html>
