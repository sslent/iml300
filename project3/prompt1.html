<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>What is a Woman? — Define</title>
        <style>
            @font-face {
                font-family: "Titlefont";
                src: url("assets/titlefont.ttf") format("truetype");
            }
            @font-face {
                font-family: "Subtitlefont";
                src: url("assets/Subtitle.ttf") format("truetype");
            }

            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: #0d0b09;
                font-family: "Subtitlefont", Georgia, serif;
                min-height: 100vh;
                overflow: hidden;
                cursor: none;
                position: relative;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
                opacity: 0.06;
                pointer-events: none;
                z-index: 300;
            }

            #bg-scene {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.8rem;
                z-index: 1;
                padding: 2rem;
                text-align: center;
            }

            /* typewriter title */
            .typewriter-wrap {
                opacity: 0;
                animation: fade-up 1s ease 0.4s forwards;
            }

            .typewriter-wrap h1 {
                font-family: "Titlefont", Georgia, serif;
                font-size: clamp(1.4rem, 4vw, 2rem);
                font-weight: 300;
                font-style: italic;
                letter-spacing: 0.14em;
                color: #e8e2d8;
                overflow: hidden;
                white-space: nowrap;
                width: 0;
                margin: 0 auto;
                border-right: 1px solid rgba(232, 226, 216, 0.65);
                animation:
                    typing 2.8s steps(22, end) 1.2s forwards,
                    blink-caret 0.75s step-end infinite;
            }

            @keyframes typing {
                from { width: 0; }
                to   { width: 22ch; }
            }

            @keyframes blink-caret {
                from, to { border-color: transparent; }
                50%      { border-color: rgba(232, 226, 216, 0.65); }
            }

            /* input area */
            .input-area {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.4rem;
                width: 100%;
                max-width: 440px;
                opacity: 0;
                transform: translateY(10px);
                transition: opacity 1.4s ease, transform 1.4s ease;
            }

            .input-area.visible {
                opacity: 1;
                transform: translateY(0);
            }

            .input-rule {
                width: 28px;
                height: 1px;
                background: rgba(232, 226, 216, 0.18);
            }

            textarea#answer1 {
                width: 100%;
                background: transparent;
                border: none;
                border-bottom: 1px solid rgba(232, 226, 216, 0.18);
                outline: none;
                resize: none;
                padding: 0.6rem 0;
                font-family: "Subtitlefont", sans-serif;
                font-size: 1.1rem;
                font-style: italic;
                color: #e8e2d8;
                line-height: 1.75;
                min-height: 72px;
                caret-color: #e8e2d8;
                text-align: center;
            }

            textarea#answer1::placeholder {
                color: rgba(232, 226, 216, 0.22);
                font-style: italic;
            }

            .submit-btn {
                font-family: "Subtitlefont", sans-serif;
                font-size: 18px;
            
                color: rgba(232, 226, 216, 0.55);
                background: none;
                border: none;
                border-bottom: 1px solid rgba(232, 226, 216, 0.2);
                padding-bottom: 3px;
                cursor: none;
                transition: color 0.3s, letter-spacing 0.4s, border-color 0.3s;
            }

            .submit-btn:hover {
                color: #d94f7a;
                letter-spacing: 0.38em;
                border-color: rgba(217, 79, 122, 0.4);
            }

            .skip-link {
                font-family: "Subtitlefont", sans-serif;
                font-size: 0.55rem;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: rgba(232, 226, 216, 0.18);
                text-decoration: none;
                transition: color 0.3s;
            }
            .skip-link:hover {
                color: rgba(232, 226, 216, 0.45);
            }

            #overlay {
                position: fixed;
                inset: 0;
                z-index: 2;
                pointer-events: none;
            }

            #cursor {
                position: fixed;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: rgba(232, 226, 216, 0.55);
                pointer-events: none;
                z-index: 999;
                transform: translate(-50%, -50%);
            }

            .flash {
                position: fixed;
                inset: 0;
                background: #e8e2d8;
                z-index: 9999;
                opacity: 0;
                pointer-events: none;
            }

            .flash.go {
                animation: flash-out 0.55s steps(1) forwards;
            }

            @keyframes flash-out {
                0%   { opacity: 0; }
                15%  { opacity: 0.9; }
                30%  { opacity: 0; }
                52%  { opacity: 0.6; }
                65%  { opacity: 0; }
                82%  { opacity: 0.85; }
                100% { opacity: 0; }
            }

            @keyframes fade-up {
                from { opacity: 0; transform: translateY(8px); }
                to   { opacity: 1; transform: translateY(0); }
            }

            nav {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 200;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem 2.5rem;
                font-family: "Subtitlefont", sans-serif;
                font-size: 0.62rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            nav a {
                color: rgba(232, 226, 216, 0.22);
                text-decoration: none;
                transition: color 0.2s;
            }
            nav a:hover { color: rgba(232, 226, 216, 0.6); }

            .nav-center { color: rgba(232, 226, 216, 0.15); }
        </style>
    </head>
    <body>
        <div id="cursor"></div>
        <div class="flash" id="flash"></div>

        <nav>
            <span></span>
        </nav>

        <div id="bg-scene">

            <div class="typewriter-wrap">
                <h1>What is a woman?</h1>
            </div>

            <div class="input-area" id="inputArea">
                <div class="input-rule"></div>
                <textarea
                    id="answer1"
                    rows="3"
                    placeholder="I'd like to hear from you. I promise it's not a trick question :)"
                    autocomplete="off"
                    spellcheck="false"></textarea>
                <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">Continue</button>
            </div>

        </div>

        <canvas id="overlay"></canvas>

        <script>
            // ── canvas scratch overlay ──
            const canvas = document.getElementById("overlay");
            const ctx = canvas.getContext("2d");
            const cursorEl = document.getElementById("cursor");
            const inputArea = document.getElementById("inputArea");
            const ta = document.getElementById("answer1");

            let W, H, overlayReady = false;
            let brushRadius = 88;

            const overlayImage = new Image();
            overlayImage.src = "assets/pinkoverlay.png";

            function drawOverlay() {
                ctx.clearRect(0, 0, W, H);
                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(overlayImage, 0, 0, W, H);
                overlayReady = true;
            }

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                if (overlayImage.complete && overlayImage.naturalWidth > 0) drawOverlay();
            }

            overlayImage.onload = () => {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                drawOverlay();
            };

            resize();
            window.addEventListener("resize", resize);

            document.addEventListener("mousemove", (e) => {
                cursorEl.style.left = e.clientX + "px";
                cursorEl.style.top = e.clientY + "px";
                if (!overlayReady) return;
                ctx.globalCompositeOperation = "destination-out";
                ctx.beginPath();
                ctx.arc(e.clientX, e.clientY, brushRadius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(0,0,0,1)";
                ctx.fill();
            });

            document.addEventListener("mousedown", () => { brushRadius = 140; });
            document.addEventListener("mouseup",   () => { brushRadius = 88; });

            document.addEventListener("touchmove", (e) => {
                e.preventDefault();
                const t = e.touches[0];
                cursorEl.style.left = t.clientX + "px";
                cursorEl.style.top  = t.clientY + "px";
                if (!overlayReady) return;
                ctx.globalCompositeOperation = "destination-out";
                ctx.beginPath();
                ctx.arc(t.clientX, t.clientY, 110, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(0,0,0,1)";
                ctx.fill();
            }, { passive: false });

            // show input after typewriter finishes
            setTimeout(() => {
                inputArea.classList.add("visible");
                ta.focus();
            }, 4200);

            // ── submit — saves to sessionStorage then navigates ──
            function handleSubmit() {
                const val = ta.value.trim();

                // save even if blank so prompt2 knows they visited
                sessionStorage.setItem("firstDefinition", val);

                document.getElementById("flash").classList.add("go");

                setTimeout(() => {
                    window.location.href = "page1.html";
                }, 1380);
            }

            ta.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") handleSubmit();
            });
        </script>
    </body>
</html>
