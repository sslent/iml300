<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dear Miyoko</title>
		<link rel="stylesheet" href="https://use.typekit.net/qxs5yrx.css" />
		<style>
			@font-face {
				font-family: "BodyFont";
				src: url("assets/bodyfont.ttf") format("truetype");
			}
			* {
				margin: 0;
				padding: 0;
			}
			body {
				height: 100vh;
			}
	#background-video {
	z-index: -1;
	position: fixed;
	top: 50%;
	left: 48%;          /* move slightly left (50% = center) */
	transform: translate(-50%, -50%) scale(0.96); /* smaller */
	width: 100%;
	height: 100%;
	object-fit: cover;
}
			.content {
				z-index: 1;
				position: relative;
				text-align: center;
				padding-top: 10px;
				color: black;
				display: flex;
				flex-direction: column;
				align-items: center;
			}
			#title-svg {
				width: 80vw;
				max-width: 1050px;
				overflow: visible;
			}
			#title-text {
				font-family: "zapfino-extra-lt-pro", serif;
				font-size: 230px;
				fill: transparent;
				stroke: #000;
				stroke-width: 1px;
				stroke-dasharray: 5000;
				stroke-dashoffset: 5000;
				animation: handwrite 8s ease forwards;
				animation-delay: 0.5s;
			}
			#title-text.filled {
				animation:
					handwrite 4s ease forwards,
					fillin 0.8s ease forwards;
				animation-delay: 0.5s, 3s;
			}
			@keyframes handwrite {
				to {
					stroke-dashoffset: 0;
				}
			}
			@keyframes fillin {
				to {
					fill: #000;
					stroke-width: 0;
				}
			}
			a {
				font-family: "zapfino-extra-lt-pro", serif;
				text-decoration: none;
				color: #fbf8f8;
				font-size: 25px;
				margin-top: 0px;
				display: block;
				width: 100%;
				text-align: center;
				opacity: 0;
				animation: fadein 4s ease forwards;
				animation-delay: 4s;
				
				text-shadow: 0 0 12px rgba(255,255,255,0.35);
			}
			@keyframes fadein {
				to {
					opacity: 1;
				}
			}
		</style>
	</head>
	<body>
		<video autoplay muted loop id="background-video">
			<source src="assets/homepageanimation.mp4" type="video/mp4" />
		</video>
		<div class="content">
			<svg id="title-svg" viewBox="0 0 1100 220" xmlns="http://www.w3.org/2000/svg">
				<text id="title-text" class="filled" x="50%" y="65%" dominant-baseline="middle" text-anchor="middle">
					Dear Miyoko
				</text>
			</svg>
			<a href="page1.html">Click to Begin</a>
		</div>
		<script>
			window.addEventListener("load", () => {
				const text = document.getElementById("title-text");
				const length = text.getTotalLength?.() ?? 5000;
				text.style.strokeDasharray = length;
				text.style.strokeDashoffset = length;
			});
		</script>
	</body>
</html>
