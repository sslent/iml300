<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dear Miyoko</title>
		<style>
			@font-face {
				font-family: "TitleFont";
				src: url("assets/Titlefont.ttf") format("truetype");
			}
			@font-face {
				font-family: "BodyFont";
				src: url("assets/bodyfont.ttf") format("truetype");
			}
			* {
				margin: 0;
				padding: 0;
			}
			body {
				height: 100vh;
			}
			#background-video {
				z-index: -1;
				position: fixed;
				right: 0;
				bottom: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
			}
			.content {
				z-index: 1;
				position: relative;
				text-align: center;
				top: 60%;
				transform: translateY(-50%);
				color: black;
			}
			h1 {
				font-size: 150px;
				font-family: "TitleFont", serif;
			}
			p {
				font-size: 20px;
				margin-top: 20px;
			}
			a {
				font-family: "BodyFont", serif;
				text-decoration: none;
				color: #fbf8f8;
				font-size: 25px;
				margin-top: 20px;
				display: inline-block;
			}
		</style>
	</head>
	<body>
		<video autoplay muted loop id="background-video">
			<source src="assets/homepageanimation.mp4" type="video/mp4" />
		</video>
		<div class="content">
			<h1>Dear Miyoko</h1>
			<a href="page1.html">Click to Begin</a>
		</div>
	</body>
</html>
