<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Part II</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #0e0c0b;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      video {
        /* 9:16 ratio — fit height, constrain width */
        height: 100vh;
        width: calc(100vh * (9 / 16));
        max-width: 100vw;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <video autoplay muted loop playsinline>
      <source src="assets/lovepart2video.mp4" type="video/mp4" />
    </video>
  </body>
</html>
